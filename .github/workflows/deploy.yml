name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Restructure for GitHub Pages
        run: |
          # Move React app build to /app/ subpath
          mkdir -p _deploy/app
          mv dist/* _deploy/app/ 2>/dev/null || true
          mv dist/.* _deploy/app/ 2>/dev/null || true
          # Copy landing page and demo files to root
          cp index.html _deploy/
          cp demo-dispatcher.html _deploy/
          cp demo-privateer.html _deploy/
          cp demo-exitium.html _deploy/
          # Add 404 for React app client-side routing
          cp _deploy/app/index.html _deploy/app/404.html
          # CNAME for custom domain at root level
          echo "Destrox64.com" > _deploy/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
