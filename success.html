<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privateer — Purchase Complete</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2d3145;
      --text: #e8eaed;
      --muted: #9aa0b0;
      --dim: #6b7280;
      --green: #22c55e;
      --green-hover: #16a34a;
      --blue: #3b82f6;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 2.2rem; color: #fff;
    }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 28px; font-size: 15px; }
    .btn-download {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--green); color: #fff; border: none; border-radius: 12px;
      padding: 16px 36px; font-size: 16px; font-weight: 700;
      text-decoration: none; cursor: pointer; transition: all .2s;
      width: 100%; justify-content: center;
    }
    .btn-download:hover { background: var(--green-hover); transform: translateY(-1px); text-decoration: none; }
    .help { margin-top: 20px; font-size: 13px; color: var(--dim); }
    .help a { color: var(--muted); }
    .help a:hover { color: var(--text); }
    footer {
      margin-top: 40px; color: var(--dim); font-size: 13px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Payment Successful!</h1>
    <p>Thank you for purchasing Privateer. Your license key will be sent to your email. Click below to download the app.</p>
    <a href="https://privateer-app.web.app/privateer/Privateer.exe" class="btn-download">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Privateer
    </a>
    <div class="help">
      <p>Already have the app? Open it and enter your license key to activate.</p>
    </div>
  </div>
  <footer>
    <p>&copy; 2026 Privateer &middot; <a href="/">Back to Home</a></p>
  </footer>
</body>
</html>
